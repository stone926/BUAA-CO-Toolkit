<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2332"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#243447"/>
      <stop offset="100%" style="stop-color:#1a2a3a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background - rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="20" ry="20" fill="url(#bgGrad)" stroke="#4FC3F7" stroke-width="2.5"/>

  <!-- ===== Circuit traces: LEFT/RIGHT color-coded ===== -->
  <!-- Left side traces (cyan/blue) -->
  <line x1="6" y1="44" x2="30" y2="44" stroke="#4FC3F7" stroke-width="3" opacity="0.6"/>
  <line x1="6" y1="64" x2="30" y2="64" stroke="#4FC3F7" stroke-width="3" opacity="0.6"/>
  <line x1="6" y1="84" x2="30" y2="84" stroke="#4FC3F7" stroke-width="3" opacity="0.6"/>
  <!-- Right side traces (GREEN) -->
  <line x1="98" y1="44" x2="122" y2="44" stroke="#66BB6A" stroke-width="3" opacity="0.7"/>
  <line x1="98" y1="64" x2="122" y2="64" stroke="#66BB6A" stroke-width="3" opacity="0.7"/>
  <line x1="98" y1="84" x2="122" y2="84" stroke="#66BB6A" stroke-width="3" opacity="0.7"/>
  <!-- Top traces (cyan/blue) -->
  <line x1="44" y1="6" x2="44" y2="26" stroke="#4FC3F7" stroke-width="3" opacity="0.5"/>
  <line x1="64" y1="6" x2="64" y2="26" stroke="#4FC3F7" stroke-width="3" opacity="0.5"/>
  <line x1="84" y1="6" x2="84" y2="26" stroke="#4FC3F7" stroke-width="3" opacity="0.5"/>
  <!-- Bottom traces (GREEN) -->
  <line x1="44" y1="102" x2="44" y2="122" stroke="#66BB6A" stroke-width="3" opacity="0.5"/>
  <line x1="64" y1="102" x2="64" y2="122" stroke="#66BB6A" stroke-width="3" opacity="0.5"/>
  <line x1="84" y1="102" x2="84" y2="122" stroke="#66BB6A" stroke-width="3" opacity="0.5"/>

  <!-- Junction dots - left/top (cyan) -->
  <circle cx="6" cy="44" r="3" fill="#4FC3F7" opacity="0.8"/>
  <circle cx="6" cy="64" r="3" fill="#4FC3F7" opacity="0.8"/>
  <circle cx="6" cy="84" r="3" fill="#4FC3F7" opacity="0.8"/>
  <circle cx="44" cy="6" r="2.5" fill="#4FC3F7" opacity="0.6"/>
  <circle cx="64" cy="6" r="2.5" fill="#4FC3F7" opacity="0.6"/>
  <circle cx="84" cy="6" r="2.5" fill="#4FC3F7" opacity="0.6"/>
  <!-- Junction dots - right/bottom (GREEN) -->
  <circle cx="122" cy="44" r="3" fill="#66BB6A" opacity="0.85"/>
  <circle cx="122" cy="64" r="3" fill="#66BB6A" opacity="0.85"/>
  <circle cx="122" cy="84" r="3" fill="#66BB6A" opacity="0.85"/>
  <circle cx="44" cy="122" r="2.5" fill="#66BB6A" opacity="0.6"/>
  <circle cx="64" cy="122" r="2.5" fill="#66BB6A" opacity="0.6"/>
  <circle cx="84" cy="122" r="2.5" fill="#66BB6A" opacity="0.6"/>

  <!-- IC Chip body -->
  <rect x="30" y="26" width="68" height="76" rx="7" ry="7" fill="url(#chipGrad)" stroke="#4FC3F7" stroke-width="2.5"/>

  <!-- Chip notch (semicircle on left) -->
  <circle cx="30" cy="64" r="5" fill="#1a2332" stroke="#4FC3F7" stroke-width="1.5"/>

  <!-- IC Pins - Left side (cyan) -->
  <rect x="22" y="40" width="8" height="7" rx="1.5" fill="#4FC3F7"/>
  <rect x="22" y="60" width="8" height="7" rx="1.5" fill="#4FC3F7"/>
  <rect x="22" y="80" width="8" height="7" rx="1.5" fill="#4FC3F7"/>
  <!-- IC Pins - Right side (GREEN) -->
  <rect x="98" y="40" width="8" height="7" rx="1.5" fill="#66BB6A"/>
  <rect x="98" y="60" width="8" height="7" rx="1.5" fill="#66BB6A"/>
  <rect x="98" y="80" width="8" height="7" rx="1.5" fill="#66BB6A"/>
  <!-- IC Pins - Top (cyan) -->
  <rect x="42" y="18" width="7" height="8" rx="1.5" fill="#4FC3F7" opacity="0.8"/>
  <rect x="60" y="18" width="7" height="8" rx="1.5" fill="#4FC3F7" opacity="0.8"/>
  <rect x="79" y="18" width="7" height="8" rx="1.5" fill="#4FC3F7" opacity="0.8"/>
  <!-- IC Pins - Bottom (GREEN) -->
  <rect x="42" y="102" width="7" height="8" rx="1.5" fill="#66BB6A" opacity="0.8"/>
  <rect x="60" y="102" width="7" height="8" rx="1.5" fill="#66BB6A" opacity="0.8"/>
  <rect x="79" y="102" width="7" height="8" rx="1.5" fill="#66BB6A" opacity="0.8"/>

  <!-- "CO" text - SOLID bold fill -->
  <text x="64" y="58" font-family="'Consolas','Courier New','Arial Black',sans-serif" font-size="34" font-weight="900" fill="#4FC3F7" text-anchor="middle" dominant-baseline="central" letter-spacing="4" filter="url(#softGlow)">CO</text>

  <!-- Green LED indicator - prominent -->
  <circle cx="82" cy="80" r="5" fill="#2E7D32" opacity="0.7"/>
  <circle cx="82" cy="80" r="3.5" fill="#66BB6A" filter="url(#glow)"/>
  <circle cx="82" cy="80" r="2" fill="#C8E6C9"/>

  <!-- Wrench icon - LARGER and more visible -->
  <g transform="translate(33, 73) scale(1.3)" filter="url(#softGlow)">
    <path d="M14,2 L18,2 C19.7,2 21,3.3 21,5 C21,6 20.6,6.9 19.9,7.5 L18.5,7.5 L22,11 L20.5,12.5 L17,9 L17,7.5 C16.4,7.9 15.5,8.2 14.5,8.2 C12,8.2 10,6.2 10,3.7 L10,3.5 L14,2 Z" fill="#4FC3F7" stroke="#B3E5FC" stroke-width="0.8" stroke-linejoin="round" opacity="0.95"/>
  </g>

  <!-- Decorative circuit nodes at corners -->
  <circle cx="38" cy="34" r="2" fill="#4FC3F7" opacity="0.45"/>
  <circle cx="90" cy="34" r="2" fill="#66BB6A" opacity="0.45"/>
  <circle cx="38" cy="94" r="2" fill="#4FC3F7" opacity="0.45"/>
  <circle cx="90" cy="94" r="2" fill="#66BB6A" opacity="0.45"/>
</svg>
