<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="CO Toolkit">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#183b58"/>
      <stop offset="1" stop-color="#091b2d"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#7cf5dc"/>
      <stop offset="1" stop-color="#40cdb9"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="25" fill="url(#tile)"/>

  <!-- Three strong terminals per side stay distinct at 16 px. -->
  <path d="M20 44h12m-12 20h12M20 84h12m64-40h12M96 64h12M96 84h12" fill="none" stroke="#58dcca" stroke-width="7" stroke-linecap="round"/>
  <rect x="29" y="29" width="70" height="70" rx="14" fill="url(#chip)"/>

  <!-- Outlined letterforms avoid installed-font differences in the PNG and SVG. -->
  <path d="M58 49H48c-5 0-8 3-8 8v14c0 5 3 8 8 8h10M76 49h6c5 0 8 3 8 8v14c0 5-3 8-8 8h-6c-5 0-8-3-8-8V57c0-5 3-8 8-8Z" fill="none" stroke="#123047" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
