<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Terminal outline -->
  <rect x="1" y="2" width="14" height="12" rx="2" fill="none" stroke="#1565C0" stroke-width="1.5"/>
  <!-- Prompt > -->
  <polyline points="4,6 7,8 4,10" fill="none" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor line -->
  <line x1="9" y1="10" x2="12" y2="10" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round"/>
</svg>
