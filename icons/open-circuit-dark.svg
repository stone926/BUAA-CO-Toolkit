<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- IC chip body -->
  <rect x="4" y="3" width="8" height="10" rx="1" fill="none" stroke="#4FC3F7" stroke-width="1.5"/>
  <!-- Top pins, symmetric -->
  <line x1="6" y1="1" x2="6" y2="3" stroke="#4FC3F7" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="1" x2="10" y2="3" stroke="#4FC3F7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom pins, symmetric -->
  <line x1="6" y1="13" x2="6" y2="15" stroke="#4FC3F7" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="13" x2="10" y2="15" stroke="#4FC3F7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left traces, symmetric y positions -->
  <line x1="1" y1="5.5" x2="4" y2="5.5" stroke="#4FC3F7" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="1" y1="10.5" x2="4" y2="10.5" stroke="#4FC3F7" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right traces, matching left y positions -->
  <line x1="12" y1="5.5" x2="15" y2="5.5" stroke="#4FC3F7" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="10.5" x2="15" y2="10.5" stroke="#4FC3F7" stroke-width="1.2" stroke-linecap="round"/>
</svg>
