<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3e9">
  <title>鹈鹕的海岸骑行 · Pelican Pedal Club</title>
  <style>
    :root { color-scheme: light; --ink: #283e39; --paper: #f6f3e9; --muted: #7b8479; --accent: #d96948; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { max-width: 1320px; margin: auto; padding: 36px 48px 24px; }
    header, .brand, .edition, .bottom, .controls, .control, footer { display: flex; align-items: center; }
    header { justify-content: space-between; padding-bottom: 30px; border-bottom: 1px solid #d8dbcf; }
    .brand { gap: 12px; font-size: 12px; font-weight: 750; letter-spacing: 2px; }
    .brand svg { width: 38px; height: 38px; }
    .edition { gap: 9px; font-size: 11px; letter-spacing: 2px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .intro { text-align: center; padding: 32px 0 25px; }
    .eyebrow { color: var(--accent); font-size: 10px; letter-spacing: 3px; font-weight: 700; }
    h1 { font-family: Georgia, "Songti SC", "SimSun", serif; font-size: clamp(34px, 4.2vw, 56px); font-weight: 500; letter-spacing: 3px; margin: 12px 0; }
    .intro p { font-size: 13px; color: var(--muted); letter-spacing: 2px; margin: 0; }
    .postcard { position: relative; border: 1px solid #c9d3bf; border-radius: 16px; overflow: hidden; background: #e6eee1; }
    #scene { width: 100%; height: auto; display: block; --sky: #e5eddf; --sun: #efd786; --sea: #a8c7bc; --hill: #c6d6ba; }
    #scene.sunset { --sky: #f1d9c0; --sun: #df8d59; --sea: #9db6b0; --hill: #c3c9af; }
    .sky { fill: var(--sky); transition: fill 1s; } .sun { fill: var(--sun); transition: fill 1s; }
    .sea { fill: var(--sea); transition: fill 1s; } .hill { fill: var(--hill); transition: fill 1s; }
    .scene-label { position: absolute; top: 24px; left: 28px; color: #4c6860; font-size: 10px; letter-spacing: 2px; line-height: 1.8; pointer-events: none; }
    .scene-label strong { font-size: 12px; font-weight: 500; }
    .stamp { position: absolute; top: 24px; right: 25px; width: 65px; height: 65px; border: 1px solid #718a70; border-radius: 50%; display: grid; place-content: center; text-align: center; font: 10px/1.6 Georgia, serif; letter-spacing: 1px; color: #61795c; transform: rotate(12deg); }
    .bottom { justify-content: space-between; gap: 20px; padding: 23px 0 25px; }
    .caption { font: italic 18px Georgia, serif; margin: 0; } .caption small { display: block; font: 10px "Segoe UI", sans-serif; color: var(--muted); letter-spacing: 2px; margin-top: 8px; }
    .controls { gap: 18px; } .control { gap: 10px; font-size: 11px; color: #67746a; }
    button { color: var(--ink); border: 1px solid #cdd3c6; background: transparent; cursor: pointer; font: inherit; min-height: 42px; padding: 0 16px; border-radius: 25px; transition: background .2s, transform .2s; }
    button:hover { background: #e9ebdf; transform: translateY(-1px); } button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    #play { background: var(--ink); color: var(--paper); border-color: var(--ink); min-width: 112px; font-size: 12px; }
    #play:hover { background: #3d554b; } #light { font-size: 12px; }
    input[type=range] { width: 90px; accent-color: var(--ink); cursor: pointer; }
    output { min-width: 30px; font-variant-numeric: tabular-nums; }
    footer { border-top: 1px solid #d8dbcf; padding-top: 18px; justify-content: space-between; font-size: 9px; letter-spacing: 2px; color: #858b7e; }
    @media (max-width: 700px) { main { padding: 20px 18px; } header { padding-bottom: 20px; } .edition { font-size: 9px; letter-spacing: 1px; } .brand { font-size: 10px; letter-spacing: 1px; } .intro { padding: 28px 0 22px; } .intro p { font-size: 11px; letter-spacing: 1px; } .scene-label { top: 14px; left: 16px; font-size: 8px; } .scene-label strong { font-size: 10px; } .stamp { display: none; } .bottom { flex-direction: column; align-items: flex-start; } .controls { width: 100%; justify-content: space-between; gap: 8px; flex-wrap: wrap; } .control { gap: 5px; } input[type=range] { width: 65px; } button { padding: 0 12px; } #play { min-width: 95px; } footer { font-size: 8px; letter-spacing: 1px; } }
    @media (prefers-reduced-motion: reduce) { *, .sky, .sun, .sea, .hill { transition: none !important; } }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="18" stroke="currentColor"/><path d="M9 26h22M13 25c-6-8 5-13 7-6V11c0-5 7-5 7 0h8l-8 5v7c-3 5-8 6-14 2Z" fill="currentColor"/><circle cx="25" cy="10" r="1" fill="#f6f3e9"/></svg>
      PELICAN PEDAL CLUB
    </div>
    <div class="edition"><span class="dot"></span> 慢生活观察日记 / 001</div>
  </header>
  <section class="intro">
    <div class="eyebrow">A LITTLE RIDE, A LITTLE JOY</div>
    <h1>风很轻，慢慢骑。</h1>
    <p>跟着鹈鹕先生，去海边兜个风。</p>
  </section>
  <div class="postcard">
    <div class="scene-label">THE COASTAL ROUTE<br><strong>海岸线 · 晴 · 微风</strong></div>
    <div class="stamp" aria-hidden="true">TAKE IT<br>☼<br>SLOW</div>
    <svg id="scene" viewBox="0 0 1200 580" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="scene-title">鹈鹕先生的海岸骑行</title>
      <desc id="scene-desc">一只长着橙黄色大嘴、戴着绿色小帽和红围巾的白色鹈鹕，骑着绿色自行车沿海岸前行。脚掌踩动踏板，车轮旋转，云朵与路边植物向后移动。</desc>
      <defs>
        <pattern id="sea-lines" width="180" height="32" patternUnits="userSpaceOnUse"><path d="M10 7h42m43 15h62" stroke="#e2eee0" stroke-width="2" opacity=".45" stroke-linecap="round"/></pattern>
        <pattern id="road-lines" width="240" height="70" patternUnits="userSpaceOnUse"><path d="M20 37h92" stroke="#f6efda" stroke-width="4" stroke-linecap="round"/><path d="M160 9h12m38 47h6" stroke="#acb29a" stroke-width="2" stroke-linecap="round"/></pattern>
        <g id="cloud" fill="#f5f5e8"><path d="M0 30C-8 14 11 6 24 14 25-6 58-7 63 14 79 6 97 15 92 30Z"/></g>
        <g id="plant" fill="none" stroke="#6e8864" stroke-width="3" stroke-linecap="round"><path d="M0 0q6-23 0-43M0-13q-18-1-22-18M2-22q14-1 20-18"/><path d="M-22-31q18-6 21 16-18 1-21-16m42-9q-18-2-18 16 16-1 18-16" fill="#7d976c" stroke="none"/></g>
        <g id="wheel" fill="none">
          <circle r="88" stroke="#304b46" stroke-width="12"/><circle r="79" stroke="#f4eddb" stroke-width="4"/>
          <g stroke="#708c80" stroke-width="1.6"><path d="M-76 0H76M0-76V76M-53.74-53.74 53.74 53.74M-53.74 53.74 53.74-53.74M-70-29 70 29M-29-70 29 70M-70 29 70-29M-29 70 29-70"/></g>
          <circle r="9" fill="#e3c46c" stroke="#304b46" stroke-width="3"/><path d="M-8-78h16" stroke="#dfad58" stroke-width="5" stroke-linecap="round"/>
        </g>
      </defs>
      <path class="sky" d="M0 0h1200v580H0z"/>
      <circle class="sun" cx="928" cy="124" r="55"/>
      <circle cx="928" cy="124" r="70" fill="none" stroke="#f4edca" opacity=".6"/>
      <g id="clouds"><use href="#cloud" x="155" y="115"/><use href="#cloud" transform="translate(510 69) scale(.7)"/><use href="#cloud" transform="translate(1070 197) scale(1.3)"/></g>
      <g fill="none" stroke="#7e9787" stroke-width="2" stroke-linecap="round"><path id="bird-one" d="M785 98q9-10 18 0 9-10 18 0"/><path d="M827 76q6-7 12 0 6-7 12 0"/></g>
      <path class="hill" d="M0 304Q120 216 227 286T487 290Q600 242 729 306L1200 320V388H0Z"/>
      <path class="sea" d="M0 323Q320 303 601 326T1200 317V420H0Z"/>
      <path d="M0 337H1200V415H0Z" fill="url(#sea-lines)"/>
      <g transform="translate(1003 282)"><path d="M0 25h49l-9 9H10Z" fill="#678b7f"/><path d="M23 21V-22L0 21Z" fill="#f8f1dc"/><path d="M27 21V-12L44 21Z" fill="#e5d8b6"/></g>
      <path d="M0 394Q220 373 440 398T890 391T1200 388V580H0Z" fill="#d8d7b5"/>
      <path d="M0 425Q230 411 480 428T1200 420V529H0Z" fill="#c1c4a7"/>
      <path d="M0 433H1200M0 520H1200" fill="none" stroke="#a7b397" stroke-width="2"/>
      <path d="M0 446H1200V516H0Z" fill="url(#road-lines)"/>
      <g id="far-plants"><use href="#plant" transform="translate(120 418) scale(.7)"/><use href="#plant" transform="translate(950 415) scale(.6)"/><path d="M345 408l4-12 4 12m748-2 5-13 5 13" fill="none" stroke="#96a57c" stroke-width="2"/></g>
      <ellipse id="shadow" cx="593" cy="501" rx="235" ry="12" fill="#778b71" opacity=".19"/>
      <g id="rider" stroke-linecap="round" stroke-linejoin="round">
        <!-- Wheel rotation and pedal motion share the same travelled distance. -->
        <g transform="translate(432 402)"><g id="rear-wheel"><use href="#wheel"/></g></g>
        <g transform="translate(758 402)"><g id="front-wheel"><use href="#wheel"/></g></g>
        <g fill="none" stroke="#759184" stroke-width="6"><path d="M337 390a96 96 0 0 1 185-20M669 367a96 96 0 0 1 184 22"/></g>
        <path d="M472 274 496 321" stroke="#35534b" stroke-width="8"/>
        <path d="M450 274q21-8 48-2" fill="none" stroke="#774e38" stroke-width="12"/>
        <path id="far-leg" d="M526 273 572 325 567 399" fill="none" stroke="#be823e" stroke-width="10"/>
        <path id="far-foot" d="M560 399h28" fill="none" stroke="#be823e" stroke-width="10"/>
        <g fill="none" stroke="#386d61" stroke-width="9"><path d="M432 402 497 313 562 402H432L490 305H700L562 402M700 305 758 402"/><path d="M700 305 684 259Q682 246 698 247h26"/></g>
        <path d="M700 304 755 396" fill="none" stroke="#78a28b" stroke-width="3"/>
        <path d="M721 247h22" stroke="#774e38" stroke-width="10"/>
        <path d="M740 254Q765 277 749 318" fill="none" stroke="#61796b" stroke-width="2"/>
        <circle cx="706" cy="239" r="7" fill="#debb65" stroke="#736b49" stroke-width="2"/>
        <path d="M432 393 557 383a19 19 0 0 1 0 38L432 411a9 9 0 0 1 0-18Z" fill="#63917d" stroke="#386d61" stroke-width="3"/>
        <circle cx="562" cy="402" r="23" fill="#e1d8b7" stroke="#35574c" stroke-width="4"/>
        <g id="crank" stroke="#35574c" stroke-width="5"><path d="M-29 0H29"/><circle r="5" fill="#35574c"/></g>
        <!-- A long neck and generous throat pouch give the rider its pelican silhouette. -->
        <path d="M465 235 400 214 429 252 412 251 452 271" fill="#e5e5d4" stroke="#576958" stroke-width="2.5"/>
        <path d="M440 221C466 196 518 205 545 218 563 210 565 186 560 157 552 122 558 94 584 84 613 75 638 91 641 114 643 129 632 145 614 150 608 166 618 184 611 212 606 254 576 283 532 285 486 288 447 273 439 250 436 241 436 230 440 221Z" fill="#fcf8e8" stroke="#576958" stroke-width="2.5"/>
        <path d="M562 148Q580 171 578 199C577 229 556 260 529 273Q594 278 604 220C612 185 601 165 614 150Z" fill="#e5e4d1"/>
        <path d="M619 123 766 129Q747 172 709 180 651 185 619 139Z" fill="#e9b950" stroke="#946d39" stroke-width="2.5"/>
        <path d="M620 121Q687 111 772 128L619 135Z" fill="#efca65" stroke="#946d39" stroke-width="2.5"/>
        <path d="M637 143Q665 169 708 169" fill="none" stroke="#d99c41" stroke-width="2"/>
        <circle cx="613" cy="112" r="10" fill="#e9e4bf"/><g id="eye"><circle cx="615" cy="112" r="4.3" fill="#2d4139"/><circle cx="616" cy="110.5" r="1.2" fill="#fff"/></g>
        <path d="M603 97q7-4 14 0" fill="none" stroke="#576958" stroke-width="2"/>
        <path d="M561 88Q553 63 580 61 606 56 616 79" fill="#618974" stroke="#395d4f" stroke-width="2.5"/>
        <path d="M552 88q34-13 73-6" fill="none" stroke="#395d4f" stroke-width="7"/>
        <path d="M565 74q21-7 37-2" fill="none" stroke="#86a083" stroke-width="3"/>
        <g id="scarf-tail"><path d="M575 183Q537 172 509 185L490 170 487 194Q534 207 578 191" fill="#cf694b" stroke="#9a553d" stroke-width="2"/><path d="M543 186 502 185" stroke="#e2956b" stroke-width="3"/></g>
        <path d="M560 177q22 10 47 0l1 14q-25 14-47-1Z" fill="#d77551" stroke="#9a553d" stroke-width="2"/>
        <path d="M491 229Q518 209 552 229L609 253Q644 262 688 246 700 241 705 247 688 270 647 276 607 282 568 262 512 274 491 229Z" fill="#eeeddc" stroke="#576958" stroke-width="2.5"/>
        <path d="M510 236q19 20 47 17m-39-8q18 19 43 15" fill="none" stroke="#c3c9b5" stroke-width="2"/>
        <path id="near-leg" d="M537 278 594 330 591 402" fill="none" stroke="#d79b46" stroke-width="11"/>
        <path id="near-foot" d="M582 402h30l-10-8" fill="#dfa94c" stroke="#946d39" stroke-width="2.5"/>
        <path id="near-pedal" d="M-15 0h30" stroke="#344f46" stroke-width="6"/>
      </g>
      <g id="foreground"><use href="#plant" transform="translate(185 555) scale(1.15)"/><use href="#plant" transform="translate(1060 560) scale(1.4)"/><g fill="#f5eed5"><circle cx="194" cy="505" r="5"/><circle cx="1088" cy="508" r="5"/></g><g fill="none" stroke="#93a078" stroke-width="2"><path d="M65 555l6-14 5 14m656-12 4-12 5 12m162 23 4-12 5 12"/></g></g>
    </svg>
  </div>
  <div class="bottom">
    <p class="caption">Life is better at a pelican’s pace.<small>不赶时间，只追海风。</small></p>
    <div class="controls" role="group" aria-label="动画控制">
      <button id="play" type="button" aria-label="暂停动画">Ⅱ 暂停骑行</button>
      <label class="control" for="speed">速度 <input id="speed" type="range" min="0.5" max="2" value="1" step="0.25"><output id="speed-value" for="speed">1×</output></label>
      <button id="light" type="button" aria-pressed="false">☼ 切换黄昏</button>
    </div>
  </div>
  <footer><span>EST. TODAY · SOMEWHERE BY THE SEA</span><span>一小段路，一整份好心情 ↗</span></footer>
</main>
<script>
  (() => {
    const $ = id => document.getElementById(id);
    const scene = $('scene');
    const play = $('play');
    const speed = $('speed');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let running = !reducedMotion.matches;
    let elapsed = 0;
    let previous = null;
    let frameId = null;
    const parts = Object.fromEntries(['rear-wheel', 'front-wheel', 'crank', 'rider', 'near-leg', 'far-leg', 'near-foot', 'far-foot', 'near-pedal', 'clouds', 'foreground', 'far-plants', 'eye', 'scarf-tail', 'road-lines', 'sea-lines'].map(id => [id, $(id)]));

    // Repeat scenery one full viewBox apart for a seamless loop, without adding work per frame.
    for (const id of ['clouds', 'foreground', 'far-plants']) {
      const group = parts[id];
      const content = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      while (group.firstChild) content.append(group.firstChild);
      group.append(content);
      const repeat = content.cloneNode(true);
      repeat.setAttribute('transform', 'translate(1200 0)');
      group.append(repeat);
    }

    function draw(t) {
      const angle = t * 2.7;
      const degrees = angle * 180 / Math.PI;
      const distance = angle * 29;
      parts['rear-wheel'].setAttribute('transform', `rotate(${distance / 88 * 180 / Math.PI})`);
      parts['front-wheel'].setAttribute('transform', `rotate(${distance / 88 * 180 / Math.PI})`);
      parts.crank.setAttribute('transform', `translate(562 402) rotate(${degrees})`);
      parts.rider.setAttribute('transform', `translate(0 ${Math.sin(angle * 2) * 1.2})`);
      for (const [side, phase, hipX] of [['far', Math.PI, 526], ['near', 0, 537]]) {
        const x = 562 + Math.cos(angle + phase) * 29;
        const y = 402 + Math.sin(angle + phase) * 29;
        // Two equal leg segments meet at a forward-facing knee.
        const dx = x - hipX, dy = y - 278;
        const length = Math.hypot(dx, dy);
        const bend = Math.sqrt(Math.max(0, 87 * 87 - length * length / 4));
        const kneeX = (hipX + x) / 2 + dy / length * bend;
        const kneeY = (278 + y) / 2 - dx / length * bend;
        parts[`${side}-leg`].setAttribute('d', `M${hipX} 278 Q${kneeX - 5} ${kneeY - 5} ${kneeX} ${kneeY} L${x} ${y - 5}`);
        parts[`${side}-foot`].setAttribute('d', `M${x - 9} ${y - 4}q12-8 20-2l12 5h-32Z`);
        if (side === 'near') parts['near-pedal'].setAttribute('transform', `translate(${x} ${y + 3})`);
      }
      for (const [id, rate] of [['clouds', 5], ['far-plants', 45], ['foreground', 90]]) {
        parts[id].setAttribute('transform', `translate(${-((t * rate) % 1200)} 0)`);
      }
      parts['road-lines'].setAttribute('patternTransform', `translate(${-distance % 240} 0)`);
      parts['sea-lines'].setAttribute('patternTransform', `translate(${-(t * 12) % 180} 0)`);
      parts['scarf-tail'].setAttribute('transform', `rotate(${Math.sin(t * 6) * 4} 575 185)`);
      const blink = t % 4.7 > 4.52 ? .12 : 1;
      parts.eye.setAttribute('transform', `translate(0 ${112 * (1 - blink)}) scale(1 ${blink})`);
    }

    function tick(now) {
      frameId = null;
      if (!running || document.hidden) return;
      if (previous !== null) elapsed += Math.min((now - previous) / 1000, .05) * Number(speed.value);
      previous = now;
      draw(elapsed);
      frameId = requestAnimationFrame(tick);
    }
    function syncPlayback() {
      if (frameId !== null) cancelAnimationFrame(frameId);
      frameId = null;
      previous = null;
      play.textContent = running ? 'Ⅱ 暂停骑行' : '▷ 继续骑行';
      play.setAttribute('aria-label', running ? '暂停动画' : '播放动画');
      if (running && !document.hidden) frameId = requestAnimationFrame(tick);
    }
    play.addEventListener('click', () => { running = !running; syncPlayback(); });
    speed.addEventListener('input', () => { $('speed-value').value = `${Number(speed.value)}×`; });
    $('light').addEventListener('click', () => {
      const sunset = scene.classList.toggle('sunset');
      $('light').setAttribute('aria-pressed', String(sunset));
      $('light').textContent = sunset ? '☼ 切换晴天' : '☼ 切换黄昏';
      document.querySelector('.scene-label strong').textContent = sunset ? '海岸线 · 黄昏 · 微风' : '海岸线 · 晴 · 微风';
    });
    document.addEventListener('visibilitychange', syncPlayback);
    reducedMotion.addEventListener('change', event => { if (event.matches) { running = false; syncPlayback(); } });
    draw(0);
    syncPlayback();
  })();
</script>
</body>
</html>
