name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test and compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 25 for pinned legacy course executor
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Icarus Verilog for official Timer decision vectors
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install dependencies
        run: npm ci

      - name: Check source catalogs before generators can rewrite stale output
        run: npm run check:generated

      - name: Module boundary check
        run: node scripts/check-module-boundaries.mjs

      - name: Conformance dependency whitelist
        run: node conformance/mips/check-dependency-whitelist.mjs

      - name: Course contract ledger validation
        run: node conformance/mips/contract/validate-contracts.mjs

      - name: Frozen P3-P7 evidence capability/bin matrix
        run: node conformance/mips/contract/validate-evidence-gates.mjs

      - name: Frozen decision vectors (official RTL required)
        run: npm --prefix conformance/mips run verify:decisions

      - name: Candidate independent ISA/course expected data
        run: npm --prefix conformance/mips run verify:isa-golden && npm --prefix conformance/mips run verify:course-vectors

      - name: Frozen corpus seeds and feature distribution
        run: npm --prefix conformance/mips run verify:corpus-freeze

      - name: Compile production JSONL boundary for fixed seed evidence
        run: npm run compile

      - name: Reference asset verification (fail closed)
        run: node conformance/mips/reference/download-references.mjs --require-all

      - name: Frozen MARS v0.6.3 regression
        run: node conformance/mips/reference/verify-regression.mjs

      - name: Materialize and verify all 250 fixed seed source/images
        run: npm --prefix conformance/mips run verify:seed-evidence

      - name: Upload fixed seed evidence
        uses: actions/upload-artifact@v4
        with:
          name: fixed-seed-evidence-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: conformance/.cache/fixed-seed-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Conformance smoke sentinels
        run: npm --prefix conformance/mips test

      - name: Conformance lanes
        run: npm --prefix conformance/mips run run

      - name: Assembly differential lane (pinned MARS vs TS assembler)
        run: npm --prefix conformance/mips run run:assembly-diff

      - name: Test
        run: npm test

      - name: Phase 4 executor shadow gate
        run: npm run verify:phase4

      - name: Phase 5 course assembler and full-stack gate
        run: npm run verify:phase5

      - name: Headless test CLI smoke
        run: npm --prefix test-cli test

  ts-cli-conformance:
    name: Independent TS JSONL CLI conformance
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and compile production CLI
        run: npm ci && npm run compile

      - name: Conformance dependency whitelist
        run: node conformance/mips/check-dependency-whitelist.mjs

      - name: Verify only through the versioned JSONL process boundary
        run: npm --prefix conformance/mips run verify:ts-cli

  phase6-fixed-mars-execution:
    name: Phase 6 fixed MARS execution differential gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 25 for fixed legacy-course-executor
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install dependencies
        run: npm ci

      - name: Conformance dependency whitelist
        run: node conformance/mips/check-dependency-whitelist.mjs

      - name: Phase 6 permanent fixed MARS execution gate
        run: npm run verify:phase6

      - name: Upload machine-readable execution differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-execution-differential-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: conformance/.cache/phase6-execution-differential
          if-no-files-found: error
          retention-days: 30
