name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  phase6-gate:
    name: Phase 6 fixed MARS gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 25 for fixed MARS references
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install dependencies
        run: npm ci

      - name: Conformance dependency whitelist
        run: node conformance/mips/check-dependency-whitelist.mjs

      - name: Phase 6 permanent assembly and execution gate
        run: npm run verify:phase6

      - name: Upload machine-readable execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-phase6-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: conformance/.cache/phase6-execution-differential
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish VS Code extension
    needs: phase6-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and check manifest config
        run: npm run sync:manifest-config

      - name: Verify generated files are committed
        run: git diff --exit-code -- package.json resources/co/configDefaults.json

      - name: Test
        run: npm test

      - name: Compile
        run: npm run compile

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          TAG="${GITHUB_REF_NAME}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "Tag ${TAG} does not match package version ${VERSION}."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "vsix=dist/${NAME}-${VERSION}.vsix" >> "${GITHUB_OUTPUT}"

      - name: Package VSIX
        run: |
          mkdir -p dist
          npx vsce package --out "${{ steps.meta.outputs.vsix }}"

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath "${{ steps.meta.outputs.vsix }}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          awk "/^## \\[${VERSION}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VSIX="${{ steps.meta.outputs.vsix }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes-file release-notes.md
            gh release upload "${TAG}" "${VSIX}" --clobber
          else
            gh release create "${TAG}" "${VSIX}" --title "${TAG}" --notes-file release-notes.md --verify-tag
          fi
