name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish VS Code extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and check manifest config
        run: npm run sync:manifest-config

      - name: Verify generated files are committed
        run: git diff --exit-code -- package.json resources/co/configDefaults.json

      - name: Test
        run: npm test

      - name: Compile
        run: npm run compile

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          TAG="${GITHUB_REF_NAME}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "Tag ${TAG} does not match package version ${VERSION}."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "vsix=dist/${NAME}-${VERSION}.vsix" >> "${GITHUB_OUTPUT}"

      - name: Package VSIX
        run: |
          mkdir -p dist
          npx vsce package --out "${{ steps.meta.outputs.vsix }}"

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath "${{ steps.meta.outputs.vsix }}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          awk "/^## \\[${VERSION}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VSIX="${{ steps.meta.outputs.vsix }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes-file release-notes.md
            gh release upload "${TAG}" "${VSIX}" --clobber
          else
            gh release create "${TAG}" "${VSIX}" --title "${TAG}" --notes-file release-notes.md --verify-tag
          fi
