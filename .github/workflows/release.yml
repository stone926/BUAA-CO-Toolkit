name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  phase6-gate:
    name: Phase 6 fixed MARS gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 25 for fixed MARS references
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install dependencies
        run: npm ci

      - name: Conformance dependency whitelist
        run: node conformance/mips/check-dependency-whitelist.mjs

      - name: Phase 6 permanent assembly and execution gate
        run: npm run verify:phase6

      - name: Upload machine-readable execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-phase6-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: conformance/.cache/phase6-execution-differential
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package and verify Windows x64 VSIX
    needs: phase6-gate
    runs-on: windows-2025
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      version: ${{ steps.meta.outputs.version }}
      vsix_name: ${{ steps.meta.outputs.vsix_name }}
      vsix_sha256: ${{ steps.artifact.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and check committed artifacts
        run: npm run sync:generated

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Test
        run: npm test

      - name: Compile
        run: npm run compile

      - name: Read package metadata
        id: meta
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $name = node -p "require('./package.json').name"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match package version $version."
          }
          $vsixName = "$name-$version-win32-x64.vsix"
          "artifact_name=buaa-co-toolkit-win32-x64-vsix" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "vsix_name=$vsixName" >> $env:GITHUB_OUTPUT
          "vsix=dist/$vsixName" >> $env:GITHUB_OUTPUT

      - name: Package Windows x64 VSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          npx vsce package --target win32-x64 --out "${{ steps.meta.outputs.vsix }}"

      - name: Inspect VSIX and smoke bundled runtime
        shell: pwsh
        run: |
          $extractRoot = Join-Path $env:RUNNER_TEMP "buaa-co-toolkit-vsix"
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          tar -xf "${{ steps.meta.outputs.vsix }}" -C $extractRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract ${{ steps.meta.outputs.vsix }}."
          }
          $manifest = Get-Content -LiteralPath (Join-Path $extractRoot "extension.vsixmanifest") -Raw
          if ($manifest -notmatch 'TargetPlatform="win32-x64"') {
            throw "VSIX manifest is not targeted to win32-x64."
          }
          foreach ($forbidden in @("src", "scripts", "test-cli", "tmp", "node_modules/@rolldown")) {
            if (Test-Path -LiteralPath (Join-Path $extractRoot "extension/$forbidden")) {
              throw "VSIX contains development-only path: $forbidden"
            }
          }
          node scripts/verify-bundled-iverilog.mjs (Join-Path $extractRoot "extension")
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Icarus smoke failed from extracted VSIX."
          }

      - name: Record VSIX digest
        id: artifact
        shell: pwsh
        run: |
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath "${{ steps.meta.outputs.vsix }}").Hash.ToLowerInvariant()
          "sha256=$sha256" >> $env:GITHUB_OUTPUT
          Write-Output "VSIX SHA-256: $sha256"

      - name: Upload verified VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.vsix }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified VSIX
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install publishing dependencies
        run: npm ci

      - name: Download verified VSIX
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: dist

      - name: Verify downloaded VSIX digest
        shell: bash
        run: |
          echo "${{ needs.package.outputs.vsix_sha256 }}  dist/${{ needs.package.outputs.vsix_name }}" | sha256sum --check -

      - name: Fetch and verify corresponding sources
        run: node scripts/fetch-iverilog-corresponding-sources.mjs dist/corresponding-sources

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --skip-duplicate --packagePath "dist/${{ needs.package.outputs.vsix_name }}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ needs.package.outputs.version }}"
          awk "/^## \\[${VERSION}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VSIX="dist/${{ needs.package.outputs.vsix_name }}"
          SOURCE_ASSETS=(
            dist/corresponding-sources/*.src.tar.zst
            dist/corresponding-sources/SHA256SUMS
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes-file release-notes.md
            gh release upload "${TAG}" "${VSIX}" "${SOURCE_ASSETS[@]}" --clobber
          else
            gh release create "${TAG}" "${VSIX}" "${SOURCE_ASSETS[@]}" --title "${TAG}" --notes-file release-notes.md --verify-tag
          fi
