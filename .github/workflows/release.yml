name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  phase6-gate:
    name: Phase 6 fixed MARS gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 25 for fixed MARS references
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install dependencies
        run: npm ci

      - name: Conformance dependency whitelist
        run: node conformance/mips/check-dependency-whitelist.mjs

      - name: Phase 6 permanent assembly and execution gate
        run: npm run verify:phase6

      - name: Upload machine-readable execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-phase6-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: conformance/.cache/phase6-execution-differential
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test release candidate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          node --test scripts/package-vsix.test.mjs

      - name: Verify generated files are committed
        run: git diff --exit-code

  package:
    name: Package and verify ${{ matrix.target }} VSIX
    needs:
      - phase6-gate
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-2025
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi
          vsix_name="${name}-${version}-${{ matrix.target }}.vsix"
          echo "vsix_name=${vsix_name}" >> "${GITHUB_OUTPUT}"
          echo "vsix=dist/${vsix_name}" >> "${GITHUB_OUTPUT}"

      - name: Restore Unix runtime executable bits
        if: runner.os != 'Windows'
        shell: bash
        run: |
          runtime="vendor/iverilog/${{ matrix.target }}"
          chmod +x \
            "${runtime}/bin/iverilog" \
            "${runtime}/bin/iverilog-vpi" \
            "${runtime}/bin/vvp" \
            "${runtime}/lib/ivl/ivl" \
            "${runtime}/lib/ivl/ivlpp"
          if [[ -f "${runtime}/lib/ivl/vhdlpp" ]]; then
            chmod +x "${runtime}/lib/ivl/vhdlpp"
          fi

      - name: Package ${{ matrix.target }} VSIX
        shell: bash
        run: |
          mkdir -p dist
          node scripts/package-vsix.mjs --target "${{ matrix.target }}" --out "${{ steps.meta.outputs.vsix }}"

      - name: Inspect VSIX and smoke bundled runtime
        shell: bash
        run: |
          extract_root="${RUNNER_TEMP}/buaa-co-toolkit-vsix-${{ matrix.target }}"
          mkdir -p "${extract_root}"
          unzip -q "${{ steps.meta.outputs.vsix }}" -d "${extract_root}"
          if ! grep -Fq 'TargetPlatform="${{ matrix.target }}"' "${extract_root}/extension.vsixmanifest"; then
            echo "VSIX manifest is not targeted to ${{ matrix.target }}." >&2
            exit 1
          fi
          for forbidden in src scripts test-cli tmp node_modules/@rolldown; do
            if [[ -e "${extract_root}/extension/${forbidden}" ]]; then
              echo "VSIX contains development-only path: ${forbidden}" >&2
              exit 1
            fi
          done
          runtime_root="${extract_root}/extension/vendor/iverilog"
          runtime_directories=("${runtime_root}"/*/)
          if [[ ${#runtime_directories[@]} -ne 1 || "${runtime_directories[0]}" != "${runtime_root}/${{ matrix.target }}/" ]]; then
            echo "VSIX must contain only the ${{ matrix.target }} Icarus runtime; found: ${runtime_directories[*]}" >&2
            exit 1
          fi
          node scripts/verify-bundled-iverilog.mjs "${extract_root}/extension"

      - name: Upload verified VSIX
        uses: actions/upload-artifact@v4
        with:
          name: buaa-co-toolkit-${{ matrix.target }}-vsix
          path: ${{ steps.meta.outputs.vsix }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified VSIX
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install publishing dependencies
        run: npm ci

      - name: Download verified VSIX
        uses: actions/download-artifact@v4
        with:
          pattern: buaa-co-toolkit-*-vsix
          merge-multiple: true
          path: dist

      - name: Verify downloaded VSIX set
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi
          shopt -s nullglob
          vsixes=(dist/*.vsix)
          if [[ ${#vsixes[@]} -ne 5 ]]; then
            echo "Expected exactly five VSIX files, found ${#vsixes[@]}." >&2
            exit 1
          fi
          for target in win32-x64 darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            test -f "dist/buaa-co-toolkit-${version}-${target}.vsix"
          done
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Fetch and verify corresponding sources
        shell: bash
        run: |
          node scripts/fetch-iverilog-corresponding-sources.mjs dist/corresponding-sources
          (
            cd dist/corresponding-sources
            sha256sum --check --strict SHA256SUMS
            shopt -s nullglob
            SOURCE_ARCHIVES=(*.src.tar.zst *.tar.gz)
            if [[ ${#SOURCE_ARCHIVES[@]} -ne 8 ]]; then
              echo "Expected exactly eight corresponding-source archives, found ${#SOURCE_ARCHIVES[@]}." >&2
              exit 1
            fi
            diff -u \
              <(awk '{print $2}' SHA256SUMS | sort) \
              <(printf '%s\n' "${SOURCE_ARCHIVES[@]}" | sort)
          )

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --skip-duplicate --packagePath dist/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          awk "/^## \\[${VERSION}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          shopt -s nullglob
          VSIX_ASSETS=(dist/*.vsix)
          SOURCE_ASSETS=(
            dist/corresponding-sources/*.src.tar.zst
            dist/corresponding-sources/*.tar.gz
            dist/corresponding-sources/SHA256SUMS
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes-file release-notes.md
            gh release upload "${TAG}" "${VSIX_ASSETS[@]}" "${SOURCE_ASSETS[@]}" --clobber
          else
            gh release create "${TAG}" "${VSIX_ASSETS[@]}" "${SOURCE_ASSETS[@]}" --title "${TAG}" --notes-file release-notes.md --verify-tag
          fi

          CHECK_DIR="$(mktemp -d)"
          for asset in "${VSIX_ASSETS[@]}" "${SOURCE_ASSETS[@]}"; do
            basename "${asset}"
          done | sort > "${CHECK_DIR}/expected-assets.txt"
          gh release view "${TAG}" --json assets --jq '.assets[].name' \
            | sort > "${CHECK_DIR}/actual-assets.txt"
          diff -u "${CHECK_DIR}/expected-assets.txt" "${CHECK_DIR}/actual-assets.txt"

          awk '{print $2 "\tsha256:" $1}' dist/corresponding-sources/SHA256SUMS \
            | sort > "${CHECK_DIR}/expected-source-digests.txt"
          gh release view "${TAG}" --json assets \
            --jq '.assets[] | select((.name | endswith(".src.tar.zst")) or (.name | endswith(".tar.gz"))) | [.name, .digest] | @tsv' \
            | sort > "${CHECK_DIR}/actual-source-digests.txt"
          diff -u \
            "${CHECK_DIR}/expected-source-digests.txt" \
            "${CHECK_DIR}/actual-source-digests.txt"
